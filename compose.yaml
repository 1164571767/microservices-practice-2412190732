name: petcare-microservices
services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_ADMIN_ENABLE: 'true'
      NACOS_AUTH_CONSOLE_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
    ports:
    - 127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080
    - 127.0.0.1:8848:8848
    - 127.0.0.1:9848:9848
    volumes:
    - nacos-data:/home/nacos/data
    - nacos-logs:/home/nacos/logs
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8848/nacos/v3/admin/core/state/readiness
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  micro-mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      CLINIC_DB_PASSWORD: ${CLINIC_DB_PASSWORD:?CLINIC_DB_PASSWORD is required}
      PHARMACY_DB_PASSWORD: ${PHARMACY_DB_PASSWORD:?PHARMACY_DB_PASSWORD is required}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    volumes:
    - micro-mysql-data:/var/lib/mysql
    - ./scripts/mysql-init-services.sh:/docker-entrypoint-initdb.d/01-services.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  identity-service:
    build:
      context: ./services/identity-service
    image: petcare-identity:week07
    ports:
    - 127.0.0.1:8081:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_identity
      DB_USER: svc_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PATIENT_SERVICE_URL: http://patient-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:?BOOTSTRAP_ADMIN_PHONE is required}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  patient-service: &patient-service
    build:
      context: ./services/patient-service
    image: petcare-patient:week08
    ports:
    - 127.0.0.1:8082:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_patient
      DB_USER: svc_patient
      DB_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PATIENT_SERVICE_URL: http://patient-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  patient-replica:
    <<: *patient-service
    profiles: [week08]
    ports: []
  clinic-service:
    build:
      context: ./services/clinic-service
    image: petcare-clinic:week08
    ports:
    - 127.0.0.1:8083:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_clinic
      DB_USER: svc_clinic
      DB_PASSWORD: ${CLINIC_DB_PASSWORD:?CLINIC_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  pharmacy-service:
    build:
      context: ./services/pharmacy-service
    image: petcare-pharmacy:week07
    ports:
    - 127.0.0.1:8084:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_pharmacy
      DB_USER: svc_pharmacy
      DB_PASSWORD: ${PHARMACY_DB_PASSWORD:?PHARMACY_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PATIENT_SERVICE_URL: http://patient-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      clinic-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  billing-service:
    build:
      context: ./services/billing-service
    image: petcare-billing:week07
    ports:
    - 127.0.0.1:8085:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_billing
      DB_USER: svc_billing
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PATIENT_SERVICE_URL: http://patient-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      clinic-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  notification-service:
    build:
      context: ./services/notification-service
    image: petcare-notification:week07
    ports:
    - 127.0.0.1:8086:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_notification
      DB_USER: svc_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PATIENT_SERVICE_URL: http://patient-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      clinic-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  reporting-service:
    build:
      context: ./services/reporting-service
    image: petcare-reporting:week07
    ports:
    - 127.0.0.1:8087:8080
    environment:
      SERVER_PORT: '8080'
      DB_HOST: micro-mysql
      DB_PORT: '3306'
      DB_NAME: petcare_reporting
      DB_USER: svc_reporting
      DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-https://petcare.local}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-PT2S}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-PT5S}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-true}
      TZ: Asia/Shanghai
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PATIENT_SERVICE_URL: http://patient-service:8080
      CLINIC_SERVICE_URL: http://clinic-service:8080
      PHARMACY_SERVICE_URL: http://pharmacy-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize the Nacos administrator and set NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-PETCARE_SFY_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      micro-mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: petcare-gateway:week06
    ports:
    - ${APP_PORT:-8080}:8080
    depends_on:
      identity-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      clinic-service:
        condition: service_healthy
      pharmacy-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/gateway-health
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  micro-mysql-data: {}
  nacos-data: null
  nacos-logs: null
