server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Service-Token "";
    location = /gateway-health { access_log off; default_type application/json; return 200 '{"status":"UP"}'; }
    location ^~ /internal/ { return 404; }
    location ^~ /api/auth/ { set $upstream http://identity-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/identity/ { set $upstream http://identity-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/owner/ { set $upstream http://patient-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/appointment/ { set $upstream http://clinic-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/medical/ { set $upstream http://clinic-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/pharmacy/ { set $upstream http://pharmacy-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/billing/ { set $upstream http://billing-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/notification/ { set $upstream http://notification-service:8080; proxy_pass $upstream$request_uri; }
    location ^~ /api/reporting/ { set $upstream http://reporting-service:8080; proxy_pass $upstream$request_uri; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
